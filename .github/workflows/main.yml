name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack bundle
        run: |
          python3 - <<'PY'
          import os,re
          t=open('bundle.txt',encoding='utf8').read()
          parts=re.split(r'^=== FILE: (.+?) ===\r?\n',t,flags=re.M)
          for i in range(1,len(parts),2):
              p=parts[i].strip()
              os.makedirs(os.path.dirname(p) or '.',exist_ok=True)
              open(p,'w',encoding='utf8',newline='\n').write(parts[i+1].replace('\r\n','\n'))
          print('unpacked',(len(parts)-1)//2,'files')
          L=['plugins {','    id("com.android.application")','    id("org.jetbrains.kotlin.android")','}',
          'android {','    namespace = "app.osmautosquad"','    compileSdk = 34',
          '    defaultConfig {','        applicationId = "app.osmautosquad"','        minSdk = 30','        targetSdk = 34','        versionCode = 1','        versionName = "1"','    }',
          '    compileOptions {','        sourceCompatibility = JavaVersion.VERSION_17','        targetCompatibility = JavaVersion.VERSION_17','    }',
          '    kotlinOptions {','        jvmTarget = "17"','    }','}',
          'dependencies {','    implementation("com.google.mlkit:text-recognition:16.0.0")','    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")','}']
          open('app/build.gradle.kts','w',encoding='ascii').write('\n'.join(L)+'\n')
          PY
      - run: cat -A app/build.gradle.kts | head -30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: osm-auto-squad-apk
          path: app/build/outputs/apk/debug/*.apk
